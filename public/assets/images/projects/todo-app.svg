<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dockerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d1a" />
      <stop offset="50%" stop-color="#0b1b33" />
      <stop offset="100%" stop-color="#02060d" />
    </linearGradient>
    <filter id="dockerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#dockerGrad)" />

  <!-- Docker Whale & Container Illustration -->
  <g transform="translate(250, 90)">
    <!-- Docker Containers on top of whale -->
    <g fill="#0284c7" stroke="#38bdf8" stroke-width="2">
      <!-- Row 1 -->
      <rect x="70" y="20" width="35" height="30" rx="3" />
      <rect x="115" y="20" width="35" height="30" rx="3" />
      <rect x="160" y="20" width="35" height="30" rx="3" />
      
      <!-- Row 2 -->
      <rect x="25" y="60" width="35" height="30" rx="3" />
      <rect x="70" y="60" width="35" height="30" rx="3" />
      <rect x="115" y="60" width="35" height="30" rx="3" />
      <rect x="160" y="60" width="35" height="30" rx="3" />
      <rect x="205" y="60" width="35" height="30" rx="3" />
    </g>

    <!-- Whale Body -->
    <path d="M 10 100 C 10 160 80 180 160 180 C 230 180 270 150 280 110 C 290 120 310 125 320 120 C 315 105 305 95 295 95 C 290 95 270 95 250 95 L 10 95 Z" 
          fill="#0369a1" stroke="#38bdf8" stroke-width="2.5" filter="url(#dockerGlow)" />
    
    <!-- Whale Eye -->
    <circle cx="50" cy="120" r="5" fill="#ffffff" />
    <circle cx="51" cy="120" r="2.5" fill="#0284c7" />

    <!-- Whale Spout Water -->
    <path d="M 290 85 C 290 60 305 50 325 55" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <path d="M 295 80 C 305 60 325 65 335 75" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- HUD Corner Brackets -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#0284c7" stroke-width="2" />
  <path d="M 770 50 L 770 30 L 750 30" fill="none" stroke="#0284c7" stroke-width="2" />
  <path d="M 30 400 L 30 420 L 50 420" fill="none" stroke="#0284c7" stroke-width="2" />
  <path d="M 770 400 L 770 420 L 750 420" fill="none" stroke="#0284c7" stroke-width="2" />

  <text x="50" y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">// ARCHITECTURE: FLASK CONTAINERIZATION</text>
  <text x="750" y="70" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" fill="#10b981">DOCKERFILE: MULTI-STAGE BUILD</text>

  <!-- Title Bottom -->
  <text x="400" y="360" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="4">FLASK DOCKER APP</text>
  <text x="400" y="388" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#38bdf8" letter-spacing="2">CONTAINERIZED WEB APPLICATION &amp; DEPLOYMENT</text>

  <!-- Tech badges -->
  <g transform="translate(240, 405)">
    <rect x="0" y="0" width="65" height="20" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56,189,248,0.4)" />
    <text x="32" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#38bdf8">Python</text>

    <rect x="75" y="0" width="60" height="20" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56,189,248,0.4)" />
    <text x="105" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#38bdf8">Flask</text>

    <rect x="145" y="0" width="65" height="20" rx="4" fill="rgba(2, 132, 199, 0.2)" stroke="rgba(2,132,199,0.5)" />
    <text x="177" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#38bdf8">Docker</text>

    <rect x="220" y="0" width="95" height="20" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16,185,129,0.4)" />
    <text x="267" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#34d399">Containers</text>
  </g>
</svg>
