<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b17" />
      <stop offset="50%" stop-color="#081b38" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="cloudGrid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#cloudGrad)" />
  <rect width="800" height="450" fill="url(#cloudGrid)" />

  <!-- Cloud Architecture Diagram Overlay -->
  <g transform="translate(140, 110)">
    <!-- User Client Node -->
    <rect x="0" y="50" width="100" height="60" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="#38bdf8" stroke-width="2" />
    <text x="50" y="80" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="11" fill="#ffffff">CLIENT</text>
    <text x="50" y="96" text-anchor="middle" font-family="monospace" font-size="9" fill="#38bdf8">Next.js UI</text>

    <!-- Arrow 1 -->
    <path d="M 105 80 L 165 80" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="165,77 172,80 165,83" fill="#38bdf8" />

    <!-- AWS Nginx / EC2 Reverse Proxy -->
    <rect x="175" y="40" width="130" height="80" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#60a5fa" stroke-width="2" filter="url(#neonBlur)" />
    <text x="240" y="68" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="12" fill="#ffffff">AWS EC2</text>
    <text x="240" y="86" text-anchor="middle" font-family="monospace" font-size="10" fill="#38bdf8">Nginx + PM2</text>
    <text x="240" y="102" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">Express REST API</text>

    <!-- Arrow 2 -->
    <path d="M 310 80 L 370 80" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="370,77 377,80 370,83" fill="#38bdf8" />

    <!-- AWS RDS MySQL -->
    <rect x="380" y="45" width="140" height="70" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#fbbf24" stroke-width="2" />
    <text x="450" y="75" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="11" fill="#ffffff">AWS RDS</text>
    <text x="450" y="93" text-anchor="middle" font-family="monospace" font-size="10" fill="#fbbf24">MySQL (Encrypted)</text>

    <!-- S3 & CloudWatch Floating Badges -->
    <g transform="translate(60, -40)">
      <rect width="110" height="32" rx="6" fill="rgba(30, 41, 59, 0.85)" stroke="#f97316" stroke-width="1.5" />
      <text x="55" y="20" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="10" fill="#fed7aa">AWS S3 BUCKET</text>
    </g>
    <g transform="translate(350, -40)">
      <rect width="140" height="32" rx="6" fill="rgba(30, 41, 59, 0.85)" stroke="#10b981" stroke-width="1.5" />
      <text x="70" y="20" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="10" fill="#a7f3d0">CLOUDWATCH &amp; CI/CD</text>
    </g>
  </g>

  <!-- HUD Corner Brackets -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#38bdf8" stroke-width="2" />
  <path d="M 770 50 L 770 30 L 750 30" fill="none" stroke="#38bdf8" stroke-width="2" />
  <path d="M 30 400 L 30 420 L 50 420" fill="none" stroke="#38bdf8" stroke-width="2" />
  <path d="M 770 400 L 770 420 L 750 420" fill="none" stroke="#38bdf8" stroke-width="2" />

  <text x="50" y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">// ARCHITECTURE: FULL-STACK CLOUD PORTAL</text>
  <text x="750" y="70" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" fill="#10b981">CI/CD: GITHUB ACTIONS AUTO-DEPLOY</text>

  <!-- Title Bottom -->
  <text x="400" y="360" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="26" fill="#ffffff" letter-spacing="3">STUDENT PORTAL MANAGEMENT</text>
  <text x="400" y="388" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#38bdf8" letter-spacing="2">AWS CLOUD &amp; FULL-STACK PRODUCTION SYSTEM</text>

  <!-- Tech badges -->
  <g transform="translate(170, 405)">
    <rect x="0" y="0" width="55" height="20" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56,189,248,0.4)" />
    <text x="27" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#38bdf8">AWS</text>

    <rect x="65" y="0" width="65" height="20" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56,189,248,0.4)" />
    <text x="97" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#38bdf8">Next.js</text>

    <rect x="140" y="0" width="55" height="20" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56,189,248,0.4)" />
    <text x="167" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#38bdf8">React</text>

    <rect x="205" y="0" width="65" height="20" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56,189,248,0.4)" />
    <text x="237" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#38bdf8">Node.js</text>

    <rect x="280" y="0" width="70" height="20" rx="4" fill="rgba(251, 191, 36, 0.15)" stroke="rgba(251,191,36,0.4)" />
    <text x="315" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#fbbf24">MySQL</text>

    <rect x="360" y="0" width="95" height="20" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16,185,129,0.4)" />
    <text x="407" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#34d399">GitHub Actions</text>
  </g>
</svg>
