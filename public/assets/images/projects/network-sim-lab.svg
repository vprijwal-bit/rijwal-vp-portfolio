<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030b12" />
      <stop offset="50%" stop-color="#081e28" />
      <stop offset="100%" stop-color="#02070c" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#netGrad)" />

  <!-- Network Topology Visualization -->
  <g transform="translate(100, 70)">
    <!-- Connections -->
    <line x1="200" y1="80" x2="400" y2="80" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4" />
    <line x1="200" y1="80" x2="120" y2="180" stroke="#00f0ff" stroke-width="2" />
    <line x1="200" y1="80" x2="280" y2="180" stroke="#00f0ff" stroke-width="2" />
    <line x1="400" y1="80" x2="480" y2="180" stroke="#a855f7" stroke-width="2" />
    <line x1="400" y1="80" x2="360" y2="180" stroke="#a855f7" stroke-width="2" />

    <!-- Router 1 Core -->
    <circle cx="200" cy="80" r="32" fill="#042f2e" stroke="#10b981" stroke-width="3" filter="url(#emeraldGlow)" />
    <text x="200" y="85" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="11" fill="#ffffff" font-weight="bold">R1-CORE</text>
    <text x="200" y="125" text-anchor="middle" font-family="monospace" font-size="9" fill="#10b981">192.168.10.1</text>

    <!-- Router 2 Edge -->
    <circle cx="400" cy="80" r="32" fill="#042f2e" stroke="#10b981" stroke-width="3" filter="url(#emeraldGlow)" />
    <text x="400" y="85" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="11" fill="#ffffff" font-weight="bold">R2-EDGE</text>
    <text x="400" y="125" text-anchor="middle" font-family="monospace" font-size="9" fill="#10b981">192.168.20.1</text>

    <!-- VLAN 10 Switch & Subnet -->
    <rect x="70" y="180" width="100" height="45" rx="6" fill="#0f172a" stroke="#00f0ff" stroke-width="2" />
    <text x="120" y="200" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="10" fill="#ffffff">SW-VLAN10</text>
    <text x="120" y="215" text-anchor="middle" font-family="monospace" font-size="8" fill="#00f0ff">Eng: /26</text>

    <!-- VLAN 20 Switch & Subnet -->
    <rect x="230" y="180" width="100" height="45" rx="6" fill="#0f172a" stroke="#00f0ff" stroke-width="2" />
    <text x="280" y="200" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="10" fill="#ffffff">SW-VLAN20</text>
    <text x="280" y="215" text-anchor="middle" font-family="monospace" font-size="8" fill="#00f0ff">Admin: /26</text>

    <!-- VLAN 30 & Cloud Sim -->
    <rect x="390" y="180" width="120" height="45" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="2" />
    <text x="450" y="200" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="10" fill="#ffffff">GNS3 SIM LAB</text>
    <text x="450" y="215" text-anchor="middle" font-family="monospace" font-size="8" fill="#c084fc">WAN Trunk: OSPF</text>
  </g>

  <!-- HUD Corner Brackets -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#10b981" stroke-width="2" />
  <path d="M 770 50 L 770 30 L 750 30" fill="none" stroke="#10b981" stroke-width="2" />
  <path d="M 30 400 L 30 420 L 50 420" fill="none" stroke="#10b981" stroke-width="2" />
  <path d="M 770 400 L 770 420 L 750 420" fill="none" stroke="#10b981" stroke-width="2" />

  <text x="50" y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#10b981">// LAB ENVIRONMENT: GNS3 &amp; PACKET SIMULATION</text>
  <text x="750" y="70" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00f0ff">PROTOCOL: TCP/IP | OSPF | 802.1Q</text>

  <!-- Title Bottom -->
  <text x="400" y="360" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="4">NETWORKSIMLAB</text>
  <text x="400" y="388" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#10b981" letter-spacing="2">HANDS-ON NETWORKING SIMULATION &amp; PACKET ANALYSIS</text>

  <!-- Tech badges -->
  <g transform="translate(230, 405)">
    <rect x="0" y="0" width="85" height="20" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16,185,129,0.4)" />
    <text x="42" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#10b981">Networking</text>

    <rect x="95" y="0" width="60" height="20" rx="4" fill="rgba(0, 240, 255, 0.15)" stroke="rgba(0,240,255,0.4)" />
    <text x="125" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#00f0ff">GNS3</text>

    <rect x="165" y="0" width="65" height="20" rx="4" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168,85,247,0.4)" />
    <text x="197" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#c084fc">TCP/IP</text>

    <rect x="240" y="0" width="85" height="20" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56,189,248,0.4)" />
    <text x="282" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#38bdf8">Subnetting</text>
  </g>
</svg>
