<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="50%" stop-color="#070d18" />
      <stop offset="100%" stop-color="#04070e" />
    </linearGradient>
    <linearGradient id="goldCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Border & Frame -->
  <rect width="800" height="550" fill="url(#certBg)" />
  <rect x="25" y="25" width="750" height="500" rx="4" fill="none" stroke="rgba(0, 240, 255, 0.4)" stroke-width="2" />
  <rect x="35" y="35" width="730" height="480" rx="2" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Corner Ornaments -->
  <path d="M 25 55 L 25 25 L 55 25" fill="none" stroke="#00f0ff" stroke-width="4" />
  <path d="M 775 55 L 775 25 L 745 25" fill="none" stroke="#00f0ff" stroke-width="4" />
  <path d="M 25 495 L 25 525 L 55 525" fill="none" stroke="#00f0ff" stroke-width="4" />
  <path d="M 775 495 L 775 525 L 745 525" fill="none" stroke="#00f0ff" stroke-width="4" />

  <!-- Organization Header -->
  <text x="400" y="85" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="20" fill="#00f0ff" letter-spacing="3">IPSR SOLUTIONS LTD.</text>
  <text x="400" y="110" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#94a3b8" letter-spacing="1.5">INDUSTRY-INTEGRATED TECHNICAL TRAINING &amp; INTERNSHIP</text>
  <line x1="250" y1="125" x2="550" y2="125" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" />

  <!-- Certificate Title -->
  <text x="400" y="165" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="13" fill="#cbd5e1" letter-spacing="4">CERTIFICATE OF INTERNSHIP COMPLETION</text>
  <text x="400" y="195" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#64748b">THIS IS PROUDLY PRESENTED TO</text>
  
  <!-- Candidate Name -->
  <text x="400" y="245" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="32" fill="#ffffff" letter-spacing="2" filter="url(#badgeGlow)">RIJWAL VP</text>
  <line x1="260" y1="260" x2="540" y2="260" stroke="#00f0ff" stroke-width="2" />

  <!-- Core Description -->
  <text x="400" y="295" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#e2e8f0">For successfully completing the intensive practical internship program in</text>
  <text x="400" y="325" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="700" font-size="16" fill="#38bdf8" letter-spacing="1">AI-INTEGRATED CLOUD, DEVOPS &amp; CYBERSECURITY</text>

  <!-- Competencies Box -->
  <rect x="90" y="355" width="620" height="70" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(56, 189, 248, 0.2)" />
  <text x="400" y="380" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399">KEY PRACTICAL LAB COMPETENCIES VERIFIED</text>
  <text x="400" y="405" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94a3b8">Linux Admin • AWS Cloud • Microsoft Azure • GNS3 Networking • DevOps • OWASP &amp; Burp Suite</text>

  <!-- Signatures / Footer metadata -->
  <g transform="translate(100, 455)">
    <line x1="0" y1="30" x2="160" y2="30" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
    <text x="80" y="48" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#64748b">INTERNSHIP MENTOR</text>
  </g>

  <!-- Center Security Seal -->
  <circle cx="400" cy="470" r="28" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="400" cy="470" r="22" fill="rgba(0, 240, 255, 0.1)" stroke="#00f0ff" stroke-width="1" />
  <text x="400" y="474" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="8" fill="#00f0ff" font-weight="bold">VERIFIED</text>

  <g transform="translate(540, 455)">
    <line x1="0" y1="30" x2="160" y2="30" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
    <text x="80" y="48" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#64748b">HEAD OF TRAINING, IPSR</text>
  </g>
</svg>
